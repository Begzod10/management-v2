# System nginx config — /etc/nginx/sites-available/management.gennis.uz
# Symlink: ln -s /etc/nginx/sites-available/management.gennis.uz /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name management.gennis.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name management.gennis.uz;

    ssl_certificate     /etc/letsencrypt/live/management.gennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/management.gennis.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 50M;

    root /home/managementv2/frontend/dist;
    index index.html;

    location /static/ {
        alias /home/managementv2/static/;
        expires 30d;
    }

    location /uploads/ {
        alias /home/managementv2/uploads/;
        expires 7d;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Backend routes that live outside /api/v1 — must stay proxied, not
    # swallowed by the SPA fallback below.
    location = /docs {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    location = /usage {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
